name: Fetch portable Godot runtime

on:
  push:
    branches:
      - arena/2879e691-videos-motion
    paths:
      - Asphalt/tools/runtime/REQUEST_RUNTIME
  workflow_dispatch:
    inputs:
      release_tag:
        description: Godot release tag
        required: true
        default: 4.2.2-stable
      asset_name:
        description: Official Linux x86_64 editor archive
        required: true
        default: Godot_v4.2.2-stable_linux.x86_64.zip

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the active Arena branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download and verify the official Godot editor archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '4.2.2-stable' }}
          ASSET_NAME: ${{ inputs.asset_name || 'Godot_v4.2.2-stable_linux.x86_64.zip' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ROOT="$PWD"
          OUT="$ROOT/Asphalt/tools/runtime/godot-4.2.2-linux.x86_64.zip"
          LOG="$ROOT/Asphalt/tools/runtime/fetch.log"
          mkdir -p "$(dirname "$OUT")"
          exec > >(tee "$LOG") 2>&1
          echo "Runtime fetch started $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Tag=$RELEASE_TAG Asset=$ASSET_NAME"
          VERSION="${RELEASE_TAG%-stable}"
          TUX="https://downloads.tuxfamily.org/godotengine/$VERSION/$ASSET_NAME"
          PUBLIC="https://github.com/godotengine/godot/releases/download/$RELEASE_TAG/$ASSET_NAME"
          ok=0
          rm -f "$OUT"

          if gh release download "$RELEASE_TAG" --repo godotengine/godot \
              --pattern "$ASSET_NAME" --dir "$ROOT/Asphalt/tools/runtime" --clobber; then
            if [ -f "$ROOT/Asphalt/tools/runtime/$ASSET_NAME" ]; then
              mv "$ROOT/Asphalt/tools/runtime/$ASSET_NAME" "$OUT"
            fi
            if [ -s "$OUT" ] && unzip -tqq "$OUT"; then
              echo "Source: authenticated GitHub release API"
              ok=1
            fi
          fi

          if [ "$ok" -ne 1 ]; then
            echo "Trying official TuxFamily mirror: $TUX"
            rm -f "$OUT"
            if curl -fL --retry 4 --retry-all-errors --retry-delay 3 \
                -A 'ArenaGodotRuntime/1.0' -o "$OUT" "$TUX" \
                && [ -s "$OUT" ] && unzip -tqq "$OUT"; then
              echo "Source: official TuxFamily mirror"
              ok=1
            fi
          fi

          if [ "$ok" -ne 1 ]; then
            echo "Trying public GitHub release URL: $PUBLIC"
            rm -f "$OUT"
            if curl -fL --retry 4 --retry-all-errors --retry-delay 3 \
                -A 'ArenaGodotRuntime/1.0' -o "$OUT" "$PUBLIC" \
                && [ -s "$OUT" ] && unzip -tqq "$OUT"; then
              echo "Source: public GitHub release URL"
              ok=1
            fi
          fi

          if [ -f "$OUT" ]; then
            echo "Archive bytes: $(wc -c < "$OUT")"
            sha256sum "$OUT" > "$ROOT/Asphalt/tools/runtime/godot-4.2.2-linux.x86_64.zip.sha256"
            echo "First bytes: $(head -c 4 "$OUT" | xxd -p)"
            echo "Archive contents:"
            unzip -l "$OUT" | head -20 || true
          fi
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: no source produced a valid ZIP archive"
            exit 1
          fi
          echo "Runtime fetch succeeded"

      - name: Commit the archive and log to the active branch
        if: always()
        run: |
          set -euxo pipefail
          git config user.name "Arena Runtime Bot"
          git config user.email "runtime-bot@users.noreply.github.com"
          git config http.postBuffer 524288000
          git pull --ff-only origin "$GITHUB_REF_NAME" || true
          git add -f \
            Asphalt/tools/runtime/godot-4.2.2-linux.x86_64.zip \
            Asphalt/tools/runtime/godot-4.2.2-linux.x86_64.zip.sha256 \
            Asphalt/tools/runtime/fetch.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: stage verified Godot runtime archive for sandbox tests"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No runtime changes to commit."
          fi
